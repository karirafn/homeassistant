title: Home
path: home
type: sections
max_columns: 3
background: '#111827'

sections:
  # ── Section 1: All Rooms ──────────────────────────────────────────────────────
  - type: grid
    columns: 2
    square: false
    cards:

      - type: custom:button-card
        template: room_card
        entity: light.master
        name: Hjón
        icon: mdi:bed-king
        tap_action:
          action: navigate
          navigation_path: master
        hold_action:
          action: toggle
        variables:
          color: '#5b7fad'

      - type: custom:button-card
        template: room_card
        entity: light.gudrun
        name: Guðrún
        icon: mdi:bed-single
        tap_action:
          action: navigate
          navigation_path: gudrun
        hold_action:
          action: toggle
        variables:
          color: '#b86b7d'

      - type: custom:button-card
        template: room_card
        entity: light.anaya
        name: Anaya
        icon: mdi:bed-single
        tap_action:
          action: navigate
          navigation_path: anaya
        hold_action:
          action: toggle
        variables:
          color: '#9478b8'

      - type: custom:button-card
        template: room_card
        entity: light.office
        name: Ólafía
        icon: mdi:chair-rolling
        tap_action:
          action: navigate
          navigation_path: office
        hold_action:
          action: toggle
        variables:
          color: '#4d9a88'

      - type: custom:button-card
        template: room_card
        entity: light.bathroom
        name: Bað
        icon: mdi:bathtub
        tap_action:
          action: navigate
          navigation_path: bathroom
        hold_action:
          action: toggle
        variables:
          color: '#5e8ab8'

      - type: custom:button-card
        template: room_card
        entity: light.washingroom
        name: Þvottur
        icon: mdi:washing-machine
        tap_action:
          action: navigate
          navigation_path: washingroom
        hold_action:
          action: toggle
        variables:
          color: '#52a674'

      - type: custom:button-card
        template: room_card
        entity: light.kitchen
        name: Eldhús
        icon: mdi:countertop
        tap_action:
          action: navigate
          navigation_path: kitchen
        hold_action:
          action: toggle
        variables:
          color: '#c49050'

      - type: custom:button-card
        template: room_card
        entity: light.diningroom
        name: Borðstofa
        icon: mdi:silverware
        tap_action:
          action: navigate
          navigation_path: diningroom
        hold_action:
          action: toggle
        variables:
          color: '#b39445'

      - type: custom:button-card
        template: room_card
        entity: light.sittingroom
        name: Stofa
        icon: mdi:sofa
        tap_action:
          action: navigate
          navigation_path: sittingroom
        hold_action:
          action: toggle
        variables:
          color: '#b34d60'

      - type: custom:button-card
        template: room_card
        entity: light.livingroom
        name: Sjónvarp
        icon: mdi:television
        tap_action:
          action: navigate
          navigation_path: livingroom
        hold_action:
          action: toggle
        variables:
          color: '#4d969e'

      - type: custom:button-card
        template: room_card
        entity: light.entryway
        name: Forstofa
        icon: mdi:door
        tap_action:
          action: navigate
          navigation_path: entryway
        hold_action:
          action: toggle
        variables:
          color: '#c07548'

      - type: custom:button-card
        template: room_card
        entity: light.hallway
        name: Gangur
        icon: mdi:walk
        tap_action:
          action: navigate
          navigation_path: hallway
        hold_action:
          action: toggle
        variables:
          color: '#8895a7'

  # ── Section 2: Weather ───────────────────────────────────────────────────────
  - type: grid
    columns: 1
    square: false
    cards:

      - type: weather-forecast
        entity: weather.forecast_home
        forecast_type: daily
        card_mod:
          style: |
            ha-card {
              background: #1e2d42 !important;
              border: 1px solid #334155 !important;
              border-radius: 10px !important;
              --primary-text-color: #e2e8f0;
              --secondary-text-color: #8896a8;
              --paper-item-icon-color: #94a3b8;
              font-family: 'JetBrains Mono', monospace;
            }
            .forecast .forecast-item {
              color: #8896a8;
            }

  # ── Section 3: Energy ────────────────────────────────────────────────────────
  - type: grid
    columns: 1
    cards:

      # Chargie pills
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.chargie_charge_power
            name: Hleðslustöð
            icon: mdi:ev-station
            icon_color: green
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  padding: 8px 12px !important;
                  background: color-mix(in srgb, #52a674 8%, #1e2d42);
                  border: 1px solid color-mix(in srgb, #52a674 20%, transparent);
                  border-radius: 20px;
                }
          - type: custom:mushroom-entity-card
            entity: sensor.chargie_monthly_cost_kr
            name: Kostnaður
            icon: mdi:cash
            icon_color: amber
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  padding: 8px 12px !important;
                  background: color-mix(in srgb, #c49050 8%, #1e2d42);
                  border: 1px solid color-mix(in srgb, #c49050 20%, transparent);
                  border-radius: 20px;
                }

      # Heitt vatn chart
      - type: custom:apexcharts-card
        card_mod:
          style: |
            ha-card {
              background: #1e2d42 !important;
              border: 1px solid #334155 !important;
              border-radius: 10px !important;
            }
        header:
          title: Heitt vatn
          show: true
        graph_span: 12month
        span:
          end: month
          offset: -1month
        apex_config:
          chart:
            toolbar:
              show: false
          plotOptions:
            bar:
              borderRadius: 3
              borderRadiusApplication: top
          grid:
            borderColor: '#293750'
            strokeDashArray: 4
          fill:
            type: solid
            opacity: 1
          xaxis:
            labels:
              style:
                colors: '#8896a8'
                fontFamily: "'JetBrains Mono', monospace"
                fontSize: 10px
          yaxis:
            decimalsInFloat: 0
            min: 0
            labels:
              style:
                colors: '#8896a8'
                fontFamily: "'JetBrains Mono', monospace"
                fontSize: 10px
            title:
              text: m³
              rotate: 0
              offsetY: -90
              offsetX: 5
              style:
                fontSize: 14px
                color: '#8896a8'
                fontFamily: "'JetBrains Mono', monospace"
          annotations:
            yaxis:
              - y: 44
                borderColor: '#7da4c8'
                borderWidth: 2
                strokeDashArray: 4
                label:
                  text: ''
          tooltip:
            theme: dark
        series:
          - entity: sensor.veitur_hot_water
            name: Heitt vatn
            type: column
            color: '#5e8ab8'
            unit: m³
            statistics:
              type: change
              period: month
          - entity: sensor.veitur_hot_water_monthly_mean
            name: Meðaltal
            type: line
            unit: m³
            color: '#7da4c8'
            opacity: 1
            stroke_width: 3
            stroke_dash: 0
            show:
              in_chart: false
            statistics:
              type: mean
              period: month

      # Chargie chart
      - type: custom:apexcharts-card
        card_mod:
          style: |
            ha-card {
              background: #1e2d42 !important;
              border: 1px solid #334155 !important;
              border-radius: 10px !important;
            }
        header:
          title: Hleðslustöð
          show: true
        graph_span: 12month
        span:
          start: month
          offset: -11month
        apex_config:
          chart:
            toolbar:
              show: false
          plotOptions:
            bar:
              borderRadius: 3
              borderRadiusApplication: top
          grid:
            borderColor: '#293750'
            strokeDashArray: 4
          fill:
            type: solid
            opacity: 1
          xaxis:
            labels:
              style:
                colors: '#8896a8'
                fontFamily: "'JetBrains Mono', monospace"
                fontSize: 10px
          yaxis:
            decimalsInFloat: 0
            min: 0
            labels:
              style:
                colors: '#8896a8'
                fontFamily: "'JetBrains Mono', monospace"
                fontSize: 10px
            title:
              text: kWh
              rotate: 0
              offsetY: -90
              offsetX: 5
              style:
                fontSize: 14px
                color: '#8896a8'
                fontFamily: "'JetBrains Mono', monospace"
          annotations:
            yaxis:
              - y: 647
                borderColor: '#7bc49a'
                borderWidth: 2
                strokeDashArray: 4
                label:
                  text: ''
          tooltip:
            theme: dark
        series:
          - entity: sensor.chargie_monthly_energy
            name: Hleðslustöð
            type: column
            color: '#52a674'
            unit: kWh
            statistics:
              type: change
              period: month
          - entity: sensor.chargie_monthly_energy_mean
            name: Meðaltal
            type: line
            unit: kWh
            color: '#7bc49a'
            opacity: 1
            stroke_width: 3
            stroke_dash: 0
            show:
              in_chart: false
            statistics:
              type: mean
              period: month
