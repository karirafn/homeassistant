title: Stofa
path: sittingroom
type: sections
max_columns: 1
background: '#111827'

sections:
  - type: grid
    columns: 1
    square: false
    cards:
      - type: custom:mushroom-title-card
        title: Stofa
        card_mod:
          style: |
            ha-card {
              background: color-mix(in srgb, #b34d60 6%, #111827);
              border-top: 3px solid #b34d60;
              border-radius: 10px;
            }

      - type: custom:mushroom-title-card
        title: ''
        subtitle: Ljós

      - type: custom:mushroom-light-card
        entity: light.sittingroom
        name: Öll
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1a2235;
              border: 1px solid #2a3444;
              border-top: 2px solid #b34d60;
              border-radius: 10px;
            }

      - type: custom:mushroom-light-card
        entity: light.sittingroom_sofa_table
        name: Sófaborð
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1a2235;
              border: 1px solid #2a3444;
              border-top: 2px solid #b34d60;
              border-radius: 10px;
            }

      - type: custom:mushroom-light-card
        entity: light.sittingroom_sliding_door
        name: Rennigluggi
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1a2235;
              border: 1px solid #2a3444;
              border-top: 2px solid #b34d60;
              border-radius: 10px;
            }

      - type: custom:mushroom-light-card
        entity: light.sittingroom_led
        name: LED
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1a2235;
              border: 1px solid #2a3444;
              border-top: 2px solid #b34d60;
              border-radius: 10px;
            }
