title: Bað
path: bathroom
type: sections
max_columns: 1
background: '#111827'

sections:
  - type: grid
    columns: 1
    square: false
    cards:
      - type: custom:mushroom-title-card
        title: Bað
        card_mod:
          style: |
            ha-card {
              background: color-mix(in srgb, #5e8ab8 6%, #111827);
              border-top: 3px solid #5e8ab8;
              border-radius: 10px;
            }

      - type: custom:mushroom-title-card
        title: ''
        subtitle: Ljós

      - type: custom:mushroom-light-card
        entity: light.bathroom
        name: Öll
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1e2d42;
              border: 1px solid #334155;
              border-top: 2px solid #5e8ab8;
              border-radius: 10px;
            }

      - type: custom:mushroom-light-card
        entity: light.bathroom_mirror
        name: Spegill
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1e2d42;
              border: 1px solid #334155;
              border-top: 2px solid #5e8ab8;
              border-radius: 10px;
            }

      - type: custom:mushroom-light-card
        entity: light.bathroom_sink
        name: Vaskur
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1e2d42;
              border: 1px solid #334155;
              border-top: 2px solid #5e8ab8;
              border-radius: 10px;
            }

      - type: custom:mushroom-light-card
        entity: light.bathroom_bath_shower
        name: Bað/sturta
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1e2d42;
              border: 1px solid #334155;
              border-top: 2px solid #5e8ab8;
              border-radius: 10px;
            }
