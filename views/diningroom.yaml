title: Borðstofa
path: diningroom
type: sections
max_columns: 1
background: '#111827'

sections:
  - type: grid
    columns: 1
    square: false
    cards:
      - type: custom:mushroom-title-card
        title: Borðstofa
        card_mod:
          style: |
            ha-card {
              background: color-mix(in srgb, #b39445 6%, #111827);
              border-top: 3px solid #b39445;
              border-radius: 10px;
            }

      - type: custom:mushroom-title-card
        title: ''
        subtitle: Ljós

      - type: custom:mushroom-light-card
        entity: light.diningroom
        name: Öll
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1a2235;
              border: 1px solid #2a3444;
              border-top: 2px solid #b39445;
              border-radius: 10px;
            }

      - type: custom:mushroom-light-card
        entity: light.diningroom_table
        name: Borð
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1a2235;
              border: 1px solid #2a3444;
              border-top: 2px solid #b39445;
              border-radius: 10px;
            }
