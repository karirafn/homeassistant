title: Anaya
path: anaya
type: sections
max_columns: 1
background: '#111827'

sections:
  - type: grid
    columns: 1
    square: false
    cards:
      - type: custom:mushroom-title-card
        title: Anaya
        card_mod:
          style: |
            ha-card {
              background: color-mix(in srgb, #9478b8 6%, #111827);
              border-top: 3px solid #9478b8;
              border-radius: 10px;
            }

      - type: custom:mushroom-title-card
        title: ''
        subtitle: Ljós

      - type: custom:mushroom-light-card
        entity: light.anaya
        name: Öll
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
              background: #1a2235;
              border: 1px solid #2a3444;
              border-top: 2px solid #9478b8;
              border-radius: 10px;
            }

      - type: custom:mushroom-light-card
        entity: light.anaya_ceiling
        name: Loft
        show_brightness_control: true
        card_mod:
          style: |
            ha-card {
