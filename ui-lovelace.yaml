button_card_templates:
  room_card:
    aspect_ratio: false
    tap_action:
      action: none
    hold_action:
      action: toggle
    styles:
      card:
        - background: "#1e2d42"
        - border-radius: 10px
        - border-top: "[[[ return entity && entity.state === 'on' ? `2px solid ${variables.color}` : '1px solid #334155' ]]]"
        - border-right: "1px solid #334155"
        - border-bottom: "1px solid #334155"
        - border-left: "1px solid #334155"
        - padding: 0px
      grid:
        - grid-template-areas: '"i n t" "c c c"'
        - grid-template-columns: "20px 1fr auto"
        - grid-template-rows: "auto auto"
        - padding: "10px 12px 8px 12px"
        - gap: 0px
      icon:
        - width: 16px
        - color: "[[[ return entity && entity.state === 'on' ? variables.color : '#5a6878' ]]]"
        - padding: "0 8px 0 0"
        - align-self: center
      name:
        - font-size: 12px
        - font-weight: "600"
        - color: "[[[ return entity && entity.state === 'on' ? '#e2e8f0' : '#8896a8' ]]]"
        - align-self: center
        - justify-self: start
      state:
        - display: none
      custom_fields:
        t:
          - align-self: center
          - justify-self: end
        c:
          - display: flex
          - flex-wrap: wrap
          - gap: 5px
          - padding-top: 8px
          - border-top: "1px solid #293750"
          - margin-top: 6px
    custom_fields:
      t: >
        [[[
          const isOn = entity && entity.state === 'on';
          const bri = entity && entity.attributes.brightness
            ? Math.round(entity.attributes.brightness / 255 * 100) + '%'
            : '';
          const col = variables.color || '#6366f1';
          const label = isOn ? (bri || 'ON') : 'OFF';
          return `<div style="display:flex;align-items:center;gap:5px;background:${isOn?`color-mix(in srgb,${col} 10%,#1e2d42)`:'#2a3850'};border:1px solid ${isOn?`color-mix(in srgb,${col} 25%,transparent)`:'#334155'};border-radius:12px;padding:3px 8px 3px 5px;font-family:'JetBrains Mono',monospace;font-size:9px;color:${isOn?col:'#94a3b8'}"><div style="width:5px;height:5px;border-radius:50%;background:${isOn?col:'#64748b'}"></div>${label}</div>`;
        ]]]
      c: >
        [[[
          const lights = variables.lights || [];
          const col = variables.color || '#6366f1';
          return lights.map(l => {
            const e = states[l.entity];
            const isOn = e && e.state === 'on';
            const bri = e && e.attributes.brightness
              ? Math.round(e.attributes.brightness / 255 * 100) + '%'
              : '';
            return `<div onclick="event.stopPropagation();event.currentTarget.getRootNode().host.hass.callService('light','toggle',{entity_id:'${l.entity}'})" style="display:flex;align-items:center;gap:4px;background:${isOn?`color-mix(in srgb,${col} 10%,#1e2d42)`:'#2a3850'};border:1px solid ${isOn?`color-mix(in srgb,${col} 35%,transparent)`:'#334155'};border-radius:6px;padding:4px 8px;font-size:10px;color:${isOn?col:'#94a3b8'};cursor:pointer;white-space:nowrap"><div style="width:4px;height:4px;border-radius:50%;flex-shrink:0;background:${isOn?col:'#64748b'}"></div>${l.name}${isOn&&bri?`<span style="font-family:'JetBrains Mono',monospace;font-size:8px;opacity:.7;margin-left:1px">${bri}</span>`:''}</div>`;
          }).join('');
        ]]]

views:
  - !include views/home.yaml
  - !include views/master.yaml
  - !include views/gudrun.yaml
  - !include views/anaya.yaml
  - !include views/office.yaml
  - !include views/bathroom.yaml
  - !include views/washingroom.yaml
  - !include views/kitchen.yaml
  - !include views/diningroom.yaml
  - !include views/sittingroom.yaml
  - !include views/livingroom.yaml
  - !include views/entryway.yaml
  - !include views/hallway.yaml
