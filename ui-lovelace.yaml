button_card_templates:
  room_card:
    aspect_ratio: false
    tap_action:
      action: none
    hold_action:
      action: toggle
    styles:
      card:
        - background: "#1e2d42"
        - border-radius: 10px
        - border-top: "[[[ return entity && entity.state === 'on' ? `2px solid ${variables.color}` : '1px solid #334155' ]]]"
        - border-right: "1px solid #334155"
        - border-bottom: "1px solid #334155"
        - border-left: "1px solid #334155"
        - padding: 0px
      grid:
        - grid-template-areas: '"i n t"'
        - grid-template-columns: "20px 1fr auto"
        - padding: "10px 12px 8px 12px"
        - gap: 0px
      icon:
        - width: 16px
        - color: "[[[ return entity && entity.state === 'on' ? variables.color : '#5a6878' ]]]"
        - padding: "0 8px 0 0"
        - align-self: center
      name:
        - font-size: 12px
        - font-weight: "600"
        - color: "[[[ return entity && entity.state === 'on' ? '#e2e8f0' : '#8896a8' ]]]"
        - align-self: center
        - justify-self: start
      state:
        - display: none
      custom_fields:
        t:
          - align-self: center
          - justify-self: end
    custom_fields:
      t: >
        [[[
          const isOn = entity && entity.state === 'on';
          const bri = entity && entity.attributes.brightness
            ? Math.round(entity.attributes.brightness / 255 * 100) + '%'
            : '';
          const col = variables.color || '#6366f1';
          const label = isOn ? (bri || 'ON') : 'OFF';
          return `<div style="display:flex;align-items:center;gap:5px;background:${isOn?`color-mix(in srgb,${col} 10%,#1e2d42)`:'#2a3850'};border:1px solid ${isOn?`color-mix(in srgb,${col} 25%,transparent)`:'#334155'};border-radius:12px;padding:3px 8px 3px 5px;font-family:'JetBrains Mono',monospace;font-size:9px;color:${isOn?col:'#94a3b8'}"><div style="width:5px;height:5px;border-radius:50%;background:${isOn?col:'#64748b'}"></div>${label}</div>`;
        ]]]

views:
  - !include views/home.yaml
  - !include views/master.yaml
  - !include views/gudrun.yaml
  - !include views/anaya.yaml
  - !include views/office.yaml
  - !include views/bathroom.yaml
  - !include views/washingroom.yaml
  - !include views/kitchen.yaml
  - !include views/diningroom.yaml
  - !include views/sittingroom.yaml
  - !include views/livingroom.yaml
  - !include views/entryway.yaml
  - !include views/hallway.yaml
