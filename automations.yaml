- id: '1703666220313'
  alias: Guðrún á fætur
  description: Kveikir á LED borða hjá Guðrúnu með grænu ljósi þegar það má fara á
    fætur á virkum dögum
  triggers:
  - trigger: time
    at: '07:00:00'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: light.turn_on
    data:
      rgb_color:
      - 0
      - 255
      - 0
    target:
      entity_id: light.gudrun_led
  mode: single
- id: '1703666688636'
