- id: '1703666220313'
  alias: Guðrún á fætur
  description: Kveikir á LED borða hjá Guðrúnu með grænu ljósi þegar það má fara á
    fætur á virkum dögum
  triggers:
  - trigger: time
    at: '07:00:00'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: light.turn_on
    data:
      rgb_color:
      - 0
      - 255
      - 0
    target:
      entity_id: light.gudrun_led
  mode: single
- id: '1703666688636'
  alias: Guðrún háttatími
  description: Kveikir á LED borða hjá Guðrúnu með rauðu ljósi þegar það er kominn
    háttatími
  triggers:
  - trigger: time
    at: '20:00:00'
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id: light.gudrun_led
    data:
      rgb_color:
      - 255
      - 0
      - 0
  mode: single
- id: '1703761516729'
  alias: Heimkoma
  description: Kveikir ljós þegar einhver kemur heim
  triggers:
  - trigger: state
    entity_id:
    - zone.home
    from: '0'
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.entryway
      - light.hallway_ceiling
      - light.bathroom
    data: {}
  mode: single
- id: '1703959289894'
  alias: Anaya á fætur
  description: Kveikir á LED borða hjá Anayu með grænu ljósi þegar það má fara á fætur
    á virkum dögum
  triggers:
  - trigger: time
    at: '07:00:00'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: light.turn_on
    data:
      rgb_color:
      - 0
      - 255
      - 0
      brightness_pct: 1
    target:
      entity_id: light.anaya_led
  mode: single
- id: '1714700000000'
  alias: Veitur backfill
  description: Corrects monthly statistics from Veitur API after new reading arrives
  triggers:
  - trigger: time
    at: '06:00:00'
  conditions:
  - condition: template
    value_template: '{{ now().day in [2, 5] }}'
  actions:
  - action: shell_command.backfill_veitur
  mode: single
- id: '1709374831741'
  alias: Guðrún á fætur (helgar)
  description: ''
  triggers:
  - trigger: time
    at: '08:00:00'
  conditions:
  - condition: time
    weekday:
    - sat
    - sun
  actions:
  - action: light.turn_on
    data:
      rgb_color:
      - 0
      - 255
      - 0
    target:
      entity_id: light.gudrun_led
  mode: single
